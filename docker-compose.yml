services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nerve}
      POSTGRES_USER: ${POSTGRES_USER:-nerve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - nerve-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      NERVE_HTTP_ADDR: :8080
      NERVE_DATABASE_URL: postgres://${POSTGRES_USER:-nerve}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nerve}?sslmode=disable
      NERVE_MIGRATIONS_DIR: /app/migrations
      NERVE_COOKIE_SECURE: ${NERVE_COOKIE_SECURE:-false}
      NERVE_TRUST_PROXY: "true"
      NERVE_ALLOWED_ORIGIN: ${NERVE_ALLOWED_ORIGIN:-http://localhost:3000}
      NERVE_SESSION_TTL: ${NERVE_SESSION_TTL:-24h}
      NERVE_COMMAND_RESULT_RETENTION: ${NERVE_COMMAND_RESULT_RETENTION:-30d}
      NERVE_LOG_LEVEL: ${NERVE_LOG_LEVEL:-info}
      NERVE_DISCOVERY_AGENT_TOKEN: ${NERVE_DISCOVERY_AGENT_TOKEN:?Set NERVE_DISCOVERY_AGENT_TOKEN in .env}
      NERVE_DISCOVERY_LEGACY_TOKEN: ${NERVE_DISCOVERY_LEGACY_TOKEN:-true}
      NERVE_CORE_SIGNING_KEY: ${NERVE_CORE_SIGNING_KEY:-}
      NERVE_NTOPNG_URL: ${NERVE_NTOPNG_URL:-}
      NERVE_NTOPNG_USERNAME: ${NERVE_NTOPNG_USERNAME:-}
      NERVE_NTOPNG_PASSWORD: ${NERVE_NTOPNG_PASSWORD:-}
      NERVE_NTOPNG_INTERFACE_ID: ${NERVE_NTOPNG_INTERFACE_ID:-0}
      NERVE_NTOPNG_TIMEOUT: ${NERVE_NTOPNG_TIMEOUT:-5s}
      NERVE_TRAFFIC_LOCAL_CIDRS: ${NERVE_TRAFFIC_LOCAL_CIDRS:-}
      NERVE_TRAFFIC_CAPTURE_MODE: ${NERVE_TRAFFIC_CAPTURE_MODE:-}
      NERVE_SENSOR_TOKEN: ${NERVE_SENSOR_TOKEN:-}
      NERVE_SENSOR_ADDR: :8091
      NERVE_MESHCENTRAL_URL: ${NERVE_MESHCENTRAL_URL:-}
      NERVE_MESHCENTRAL_USERNAME: ${NERVE_MESHCENTRAL_USERNAME:-}
      NERVE_MESHCENTRAL_PASSWORD: ${NERVE_MESHCENTRAL_PASSWORD:-}
      NERVE_MESHCENTRAL_CA_FILE: ${NERVE_MESHCENTRAL_CA_FILE:-}
      NERVE_MESHCENTRAL_SYNC_INTERVAL: ${NERVE_MESHCENTRAL_SYNC_INTERVAL:-5m}
    ports:
      - "127.0.0.1:${NERVE_SENSOR_PORT:-3091}:8091"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    ports:
      - "${NERVE_WEB_PORT:-3000}:8080"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--output-document=/dev/null", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 24
    restart: unless-stopped

  # Optional MeshCentral for interactive sessions (decision 0006). It runs on
  # its own origin so NERVE keeps frame-ancestors 'none'. Behind a TLS-terminating
  # proxy set TLS_OFFLOAD and REVERSE_PROXY (docs/LOCAL_DEPLOYMENT.md).
  meshcentral:
    profiles: ["meshcentral"]
    image: ghcr.io/ylianst/meshcentral:1.3.1-slim
    environment:
      # The image applies the variables below only with DYNAMIC_CONFIG.
      DYNAMIC_CONFIG: "true"
      HOSTNAME: ${NERVE_MESHCENTRAL_HOSTNAME:-localhost}
      PORT: "443"
      ALLOW_NEW_ACCOUNTS: "false"
      TLS_OFFLOAD: ${NERVE_MESHCENTRAL_TLS_OFFLOAD:-false}
      REVERSE_PROXY: ${NERVE_MESHCENTRAL_REVERSE_PROXY:-}
      REVERSE_PROXY_TLS_PORT: ${NERVE_MESHCENTRAL_REVERSE_PROXY_TLS_PORT:-443}
    volumes:
      - meshcentral-data:/opt/meshcentral/meshcentral-data
      - meshcentral-files:/opt/meshcentral/meshcentral-files
      - meshcentral-backups:/opt/meshcentral/meshcentral-backups
    ports:
      - "${NERVE_MESHCENTRAL_PORT:-8443}:443"
    restart: unless-stopped

volumes:
  nerve-postgres:
  meshcentral-data:
  meshcentral-files:
  meshcentral-backups:
