frontend:
  - changed-files:
      - any-glob-to-any-file:
          - 'app/**'
          - 'components/**'
          - 'lib/**'
          - 'public/**'
          - 'next.config.*'
          - 'postcss.config.*'
          - 'tsconfig.json'

backend:
  - changed-files:
      - any-glob-to-any-file:
          - 'cmd/**'
          - 'internal/**'
          - 'go.mod'
          - 'go.sum'

discovery:
  - changed-files:
      - any-glob-to-any-file:
          - 'cmd/nerve-agent/**'
          - 'internal/discovery/**'
          - 'Dockerfile.agent'
          - 'scripts/*discovery*'
          - 'scripts/*agent*'

traffic:
  - changed-files:
      - any-glob-to-any-file:
          - 'internal/traffic/**'
          - 'internal/integrations/ntopng/**'
          - 'cmd/nerve-server/traffic*'
          - 'scripts/*traffic*'
          - 'scripts/*map*'

agent:
  - changed-files:
      - any-glob-to-any-file:
          - 'cmd/nerve-agent/**'
          - 'Dockerfile.agent'
          - 'scripts/*agent*'

sensor:
  - changed-files:
      - any-glob-to-any-file:
          - 'native/**'
          - 'Dockerfile.sensor'
          - 'scripts/*sensor*'
          - 'scripts/*capture*'

database:
  - changed-files:
      - any-glob-to-any-file:
          - 'migrations/**'
          - 'internal/database/**'

deployment:
  - changed-files:
      - any-glob-to-any-file:
          - 'deploy/**'
