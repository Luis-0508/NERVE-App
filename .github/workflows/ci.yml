name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nerve_test
          POSTGRES_USER: nerve_test
          POSTGRES_PASSWORD: nerve_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nerve_test -d nerve_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      NERVE_TEST_DATABASE_URL: postgres://nerve_test:nerve_test_password@127.0.0.1:5432/nerve_test?sslmode=disable

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - name: Run Go tests
        run: go test ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Run discovery integration tests
        run: go test -tags=integration ./internal/discovery -count=1

      - name: Run API integration smoke test
        run: go test -tags=integration ./internal/httpapi -run '^TestAPIFlow$' -count=1

      - name: Run API process startup smoke test
        env:
          NERVE_DATABASE_URL: postgres://nerve_test:nerve_test_password@127.0.0.1:5432/nerve_test?sslmode=disable
          NERVE_HTTP_ADDR: 127.0.0.1:18080
          NERVE_DISCOVERY_AGENT_TOKEN: ci-process-agent-token
        run: |
          set -euo pipefail
          go build -o /tmp/nerve-server ./cmd/nerve-server
          /tmp/nerve-server >/tmp/nerve-api.log 2>&1 &
          api_pid=$!
          cleanup() {
            kill "$api_pid" 2>/dev/null || true
            wait "$api_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/health/ready >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$api_pid" 2>/dev/null; then
              cat /tmp/nerve-api.log
              exit 1
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/nerve-api.log
            exit 1
          fi

          curl -fsS http://127.0.0.1:18080/api/v1 | grep -q '"status":"ok"'

      - name: Install frontend dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run traffic map tests
        run: npm run test:map

      - name: Build frontend
        run: npm run build

      - name: Build web production image
        run: docker build --file Dockerfile.web --tag nerve-web:ci .

      - name: Build API image
        run: docker build --file Dockerfile.api --tag nerve-api:ci .

      - name: Build Windows discovery agent artifact
        run: docker build --file Dockerfile.agent --target artifact --build-arg TARGETOS=windows --build-arg TARGETARCH=amd64 --tag nerve-agent-windows:ci .

      - name: Build Windows traffic sensor artifact
        run: docker build --file Dockerfile.sensor --target artifact --tag nerve-sensor:ci .

      - name: Build Linux discovery agent artifact
        run: docker build --file Dockerfile.agent --target artifact --build-arg TARGETOS=linux --build-arg TARGETARCH=amd64 --tag nerve-agent-linux:ci .
