version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 100
    commit-message:
      prefix: deps

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: daily
      time: "06:10"
      timezone: Europe/Berlin
    open-pull-requests-limit: 100
    commit-message:
      prefix: deps
    ignore:
      # pgx 5.11 adds Rows.TypeMap; pgxmock v4.9.0 does not implement it yet.
      # Remove this temporary block once pgxmock supports that interface.
      - dependency-name: "github.com/jackc/pgx/v5"
        versions: [">= 5.11.0"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
      time: "06:20"
      timezone: Europe/Berlin
    open-pull-requests-limit: 100
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:30"
      timezone: Europe/Berlin
    open-pull-requests-limit: 100
    commit-message:
      prefix: ci
