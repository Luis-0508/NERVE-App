version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: cron
      cronjob: "0 6 * * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 100
    commit-message:
      prefix: deps

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: cron
      cronjob: "10 6 * * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 100
    commit-message:
      prefix: deps
    ignore:
      # pgx 5.11 adds Rows.TypeMap; pgxmock v4.9.0 does not implement it yet.
      # Remove this temporary block once pgxmock supports that interface.
      - dependency-name: "github.com/jackc/pgx/v5"
        versions: [">= 5.11.0"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: cron
      cronjob: "20 6 * * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 100
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "30 6 * * *"
      timezone: Europe/Berlin
    open-pull-requests-limit: 100
    commit-message:
      prefix: ci
